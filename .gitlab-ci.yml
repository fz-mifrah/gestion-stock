# ══════════════════════════════════════════════════════════════
#  Pipeline CI/CD DevSecOps — Gestion de Stock
#  validate → test → sast(SonarQube) → build(images) → sca(Trivy) → dast(ZAP)
# ══════════════════════════════════════════════════════════════
stages:
  - validate
  - test
  - sast
  - build
  - sca
  - dast

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  TRIVY_CACHE_DIR: ".trivycache"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"
  COMPOSE_PROJECT_NAME: "gs"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - frontend/node_modules/
    - .trivycache/

# ─────────────────────────── VALIDATE ───────────────────────────
frontend-lint-build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/dist/

# ───────────────────────────── TEST ─────────────────────────────
backend-tests:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - cd demo
    - ./mvnw test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - demo/target/surefire-reports/TEST-*.xml
    paths:
      - demo/target/classes/
      - demo/target/surefire-reports/

# ───────────────────── SAST (SonarQube) ─────────────────────────
sonarqube-check:
  stage: sast
  image: sonarsource/sonar-scanner-cli:latest
  needs:
    - backend-tests
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.host.url=$SONAR_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
  cache:
    key: "sonar-$CI_COMMIT_REF_SLUG"
    paths:
      - .sonar/cache/
  rules:
    - if: '$SONAR_PROJECT_KEY && $SONAR_URL && $SONAR_TOKEN'
    - when: never

# ──────────── BUILD : images Docker → Container Registry ─────────
build-images:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  needs:
    - backend-tests
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache docker-cli-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker compose build backend frontend
    - docker compose push backend frontend
  rules:
    - if: '$CI_REGISTRY_IMAGE'
    - when: never

# ─────────────────────── SCA (Trivy) ────────────────────────────
# 1) Scan du code source : dépendances, secrets, mauvaises configs.
trivy-fs-scan:
  stage: sca
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: []
  script:
    - trivy fs --scanners vuln,secret,misconfig --offline-scan --format json  --output trivy-fs-report.json   .
    - trivy fs --scanners vuln,secret,misconfig --offline-scan --format sarif --output trivy-fs-report.sarif  .
    # Bloquant : échoue si une vulnérabilité HIGH/CRITICAL corrigeable est présente
    - trivy fs --scanners vuln,secret,misconfig --offline-scan --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-fs-report.json
      - trivy-fs-report.sarif

# 2) Scan des images Docker construites (OS + libs embarquées).
trivy-image-scan:
  stage: sca
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs:
    - build-images
  variables:
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  script:
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-image-backend.json  "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - trivy image --severity HIGH,CRITICAL --format json --output trivy-image-frontend.json "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
    # Bloquant sur les vulnérabilités corrigeables uniquement (évite les CVE non patchables des images de base)
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CI_REGISTRY_IMAGE/backend:$IMAGE_TAG"
    - trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CI_REGISTRY_IMAGE/frontend:$IMAGE_TAG"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-image-backend.json
      - trivy-image-frontend.json
  rules:
    - if: '$CI_REGISTRY_IMAGE'
    - when: never

# ─────────────── DAST (OWASP ZAP baseline, non bloquant) ─────────
zap-baseline-scan:
  stage: dast
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build-images
  allow_failure: true
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache docker-cli-compose
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Lève l'environnement à partir des images déjà construites
    - docker compose pull backend frontend
    - docker compose up -d --no-build
    # Attend que le backend réponde sur son endpoint de santé
    - |
      echo "Attente du démarrage du backend..."
      for i in $(seq 1 40); do
        if docker run --rm --network ${COMPOSE_PROJECT_NAME}_default curlimages/curl:latest -sf http://backend:8080/actuator/health >/dev/null 2>&1; then
          echo "Backend prêt."; break
        fi
        echo "  ...tentative $i/40"; sleep 6
      done
    # Scan passif ZAP contre le frontend (qui proxifie l'API). -I = ne pas échouer sur avertissement.
    - |
      docker run --name zap --network ${COMPOSE_PROJECT_NAME}_default \
        zaproxy/zap-stable zap-baseline.py \
        -t http://frontend:8080 \
        -r zap-report.html -J zap-report.json -I || true
    # Récupère les rapports depuis le conteneur ZAP
    - docker cp zap:/zap/wrk/zap-report.html ./zap-report.html || true
    - docker cp zap:/zap/wrk/zap-report.json ./zap-report.json || true
  after_script:
    - docker rm zap || true
    - docker compose down -v || true
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - zap-report.html
      - zap-report.json
  rules:
    - if: '$CI_REGISTRY_IMAGE'
    - when: never
