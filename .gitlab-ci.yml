stages:
  - validate
  - test
  - sast
  - sca
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  TRIVY_CACHE_DIR: ".trivycache"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - frontend/node_modules/
    - .trivycache/

frontend-lint-build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run lint
    - npm run build
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - frontend/dist/

backend-tests:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - cd demo
    - ./mvnw test
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit:
        - demo/target/surefire-reports/TEST-*.xml
    paths:
      - demo/target/classes/
      - demo/target/surefire-reports/

sonarqube-check:
  stage: sast
  image: sonarsource/sonar-scanner-cli:latest
  needs:
    - backend-tests
  variables:
    SONAR_USER_HOME: "$CI_PROJECT_DIR/.sonar"
    GIT_DEPTH: "0"
  script:
    - sonar-scanner -Dsonar.projectKey=$SONAR_PROJECT_KEY -Dsonar.host.url=$SONAR_URL -Dsonar.token=$SONAR_TOKEN -Dsonar.qualitygate.wait=true
  cache:
    key: "sonar-$CI_COMMIT_REF_SLUG"
    paths:
      - .sonar/cache/
  rules:
    - if: '$SONAR_PROJECT_KEY && $SONAR_URL && $SONAR_TOKEN'
    - when: never

trivy-fs-scan:
  stage: sca
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --scanners vuln,secret,misconfig --format json --output trivy-fs-report.json .
    - trivy fs --scanners vuln,secret,misconfig --format sarif --output trivy-fs-report.sarif .
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 .
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - trivy-fs-report.json
      - trivy-fs-report.sarif

backend-package:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  needs:
    - backend-tests
  script:
    - cd demo
    - ./mvnw -DskipTests package
  artifacts:
    expire_in: 1 week
    paths:
      - demo/target/*.jar
