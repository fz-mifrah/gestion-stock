spring.application.name=gestion-stock
spring.jackson.serialization.write-dates-as-timestamps=false

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

server.port=${SERVER_PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.default-admin.enabled=${DEFAULT_ADMIN_ENABLED:false}
app.default-admin.login=${DEFAULT_ADMIN_LOGIN:admin}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD}
app.default-admin.role=${DEFAULT_ADMIN_ROLE:RESPONSABLE}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

logging.level.com.gestionstock=INFO
logging.level.org.springframework.security=INFO
