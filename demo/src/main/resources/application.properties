spring.application.name=gestion-stock
spring.jackson.serialization.write-dates-as-timestamps=false

# ────────────────────────────────────────────────────────────────
#  BASE DE DONNÉES MySQL
# ────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:8889/gestion_stock?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ────────────────────────────────────────────────────────────────
#  JPA / HIBERNATE
# ────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ────────────────────────────────────────────────────────────────
#  SERVEUR
# ────────────────────────────────────────────────────────────────
server.port=8080

# ────────────────────────────────────────────────────────────────
#  JWT  — clé secrète (minimum 256 bits = 32 caractères)
# ────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:GestionStock_LocalDevKey_ChangeMe_32CharsMin}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ────────────────────────────────────────────────────────────────
#  ADMIN INITIAL (désactivé par défaut pour éviter les credentials en dur)
# ────────────────────────────────────────────────────────────────
app.default-admin.enabled=${DEFAULT_ADMIN_ENABLED:false}
app.default-admin.login=${DEFAULT_ADMIN_LOGIN:admin}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.default-admin.role=${DEFAULT_ADMIN_ROLE:RESPONSABLE}

# ────────────────────────────────────────────────────────────────
#  SWAGGER
# ────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ────────────────────────────────────────────────────────────────
#  LOGS (DEBUG uniquement en développement)
# ────────────────────────────────────────────────────────────────
logging.level.com.gestionstock=DEBUG
logging.level.org.springframework.security=INFO
