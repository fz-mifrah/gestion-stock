spring.application.name=gestion-stock
spring.jackson.serialization.write-dates-as-timestamps=false
# ────────────────────────────────────────────────────────────────
#  BASE DE DONNÉES MySQL
# ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:8889/gestion_stock?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ────────────────────────────────────────────────────────────────
#  JPA / HIBERNATE
# ────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ────────────────────────────────────────────────────────────────
#  SERVEUR
# ────────────────────────────────────────────────────────────────
server.port=8080

# ────────────────────────────────────────────────────────────────
#  JWT  — clé secrète (minimum 256 bits = 32 caractères)
# ────────────────────────────────────────────────────────────────
jwt.secret=GestionStock_SecretKey_2026_HS256_MustBe32CharsMin!!
jwt.expiration=86400000

# ────────────────────────────────────────────────────────────────
#  SWAGGER
# ────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha

# ────────────────────────────────────────────────────────────────
#  LOGS (DEBUG uniquement en développement)
# ────────────────────────────────────────────────────────────────
logging.level.com.gestionstock=DEBUG
logging.level.org.springframework.security=INFO