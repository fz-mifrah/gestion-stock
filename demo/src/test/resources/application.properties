spring.datasource.url=jdbc:h2:mem:gestion_stock_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=test-jwt-signing-key-minimum-32-characters
jwt.expiration=3600000

app.default-admin.enabled=false

logging.level.com.gestionstock=INFO
logging.level.org.springframework.security=INFO
